<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thủy Đình Rối Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ===== Bảng màu: thủy đình, sơn son thếp vàng, nước ao ===== */
:root{
  --pond-deep:#0B2E2E;
  --pond:#14504C;
  --pond-light:#1F6B65;
  --lacquer:#B8322F;
  --lacquer-dark:#8E2422;
  --gold:#E0A431;
  --gold-light:#F1C96A;
  --paper:#F5EAD0;
  --paper-dim:#D9CBAA;
  --ink:#1C1A17;
  --ink-soft:#4A423A;
  --display:'Baloo 2', 'Segoe UI', system-ui, sans-serif;
  --body:'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  color:var(--paper);
  background:var(--pond-deep);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(224,164,49,.18), transparent 55%),
    linear-gradient(180deg, #0F3B3A 0%, var(--pond-deep) 60%, #071E1E 100%);
  min-height:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold-light);outline-offset:2px}
[hidden]{display:none!important}

/* ===== Khung chung ===== */
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 32px}
.eyebrow{
  font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold-light);opacity:.9
}
.title{font-size:34px;color:var(--paper);font-weight:800}
.title em{font-style:normal;color:var(--gold-light)}
.lead{color:var(--paper-dim);max-width:34em;margin:6px 0 0}

/* Mái thủy đình - viền đầu trang */
.roof{
  height:14px;margin:0 -16px 14px;
  background:
    repeating-linear-gradient(90deg, var(--lacquer) 0 22px, var(--lacquer-dark) 22px 26px);
  border-bottom:4px solid var(--gold);
  position:relative
}
.roof::after{
  content:"";position:absolute;left:0;right:0;bottom:-12px;height:8px;
  background:repeating-linear-gradient(90deg, transparent 0 9px, var(--gold) 9px 13px, transparent 13px 22px);
  opacity:.7
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;
  background:var(--lacquer);color:var(--paper);
  box-shadow:0 4px 0 var(--lacquer-dark), 0 10px 24px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--lacquer-dark)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #A8761C, 0 10px 24px rgba(0,0,0,.35)}
.btn.gold:active{box-shadow:0 1px 0 #A8761C}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:none;border:2px solid rgba(245,234,208,.35)}
.btn.small{padding:9px 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.field label{font-weight:500;color:var(--paper-dim)}
.field input{
  font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;
  border:2px solid rgba(245,234,208,.25);background:rgba(255,255,255,.06);color:var(--paper)
}
.field input::placeholder{color:rgba(245,234,208,.45)}
.field input:focus{border-color:var(--gold);outline:none}

/* ===== Bước 1: chọn rối ===== */
.picker{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.pick{
  position:relative;border:2px solid rgba(245,234,208,.18);border-radius:16px;
  background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  padding:10px 10px 12px;text-align:center;color:var(--paper);
  transition:border-color .15s, transform .15s
}
.pick svg{width:100%;height:auto;display:block;max-height:180px}
.pick .nm{font-family:var(--display);font-weight:800;font-size:18px;margin-top:4px}
.pick .ds{font-size:12px;color:var(--paper-dim)}
.pick[aria-pressed="true"]{border-color:var(--gold);transform:translateY(-3px);
  box-shadow:0 0 0 3px rgba(224,164,49,.25), 0 12px 24px rgba(0,0,0,.35)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}

/* ===== Bước 2: mặc đồ ===== */
.dressbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dressbar .who{font-family:var(--display);font-size:22px;font-weight:800}
.dressbar .who span{color:var(--gold-light)}
.stage-box{
  position:relative;border-radius:20px;overflow:hidden;
  border:3px solid var(--gold);
  background:
    radial-gradient(ellipse at 50% 110%, rgba(31,107,101,.9), transparent 60%),
    linear-gradient(180deg, #0E3838 0%, var(--pond) 100%);
  box-shadow:inset 0 0 60px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.4);
  aspect-ratio:4/5;max-height:62vh;
  display:flex;align-items:flex-end;justify-content:center;
  transition:box-shadow .15s
}
.stage-box.over{box-shadow:inset 0 0 0 4px var(--gold-light), 0 12px 30px rgba(0,0,0,.4)}
.stage-box .water{
  position:absolute;left:0;right:0;bottom:0;height:22%;
  background:linear-gradient(180deg, rgba(31,107,101,.0), rgba(31,107,101,.85));
}
.stage-box .ripple{
  position:absolute;left:50%;bottom:18%;width:70%;height:12px;transform:translateX(-50%);
  border-radius:50%;border:2px solid rgba(241,201,106,.35);
  animation:ripple 3s ease-out infinite
}
.stage-box .ripple.r2{animation-delay:1.5s}
@keyframes ripple{0%{transform:translateX(-50%) scale(.4);opacity:.8}100%{transform:translateX(-50%) scale(1.3);opacity:0}}
.stage-box .puppet{
  position:relative;z-index:2;width:62%;max-width:300px;margin-bottom:6%;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));
  animation:bob 4s ease-in-out infinite
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.stage-box .hint{
  position:absolute;top:10px;left:10px;right:10px;text-align:center;
  font-size:13px;color:var(--paper-dim);z-index:3;pointer-events:none
}

.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:2px solid rgba(245,234,208,.2);background:transparent;color:var(--paper-dim);
  border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px
}
.tab[aria-selected="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.tray{
  display:grid;grid-auto-flow:column;grid-auto-columns:96px;gap:10px;
  overflow-x:auto;padding:12px 2px 14px;margin-top:8px;scroll-snap-type:x proximity
}
.item{
  scroll-snap-align:start;touch-action:none;user-select:none;-webkit-user-select:none;
  border:2px solid rgba(245,234,208,.18);border-radius:14px;padding:6px 6px 8px;
  background:rgba(255,255,255,.06);color:var(--paper);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab
}
.item svg{width:72px;height:72px;display:block;pointer-events:none}
.item .lb{font-size:12px;line-height:1.2;pointer-events:none}
.item[aria-pressed="true"]{border-color:var(--gold);background:rgba(224,164,49,.15)}
.item.none{border-style:dashed}
.ghost{
  position:fixed;z-index:50;width:90px;height:90px;pointer-events:none;
  transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))
}
.ghost svg{width:100%;height:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.swatches .lbl{font-size:13px;color:var(--paper-dim);margin-right:4px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw[aria-pressed="true"]{border-color:var(--paper)}

/* ===== Bước 3: chờ ===== */
.wait{text-align:center;padding-top:20px}
.wait .puppet{width:56%;max-width:240px;margin:16px auto 0;display:block;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));animation:bob 4s ease-in-out infinite}
.count-pill{
  display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;
  background:rgba(224,164,49,.15);border:1px solid rgba(224,164,49,.4);color:var(--gold-light);font-weight:700
}

/* ===== Sân khấu ===== */
.pond{
  position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 100%, rgba(31,107,101,.95) 0%, transparent 55%),
    radial-gradient(ellipse at 50% -10%, rgba(224,164,49,.22), transparent 50%),
    linear-gradient(180deg, #07191A 0%, #0E3838 55%, var(--pond) 100%);
}
.pond .roofline{
  position:absolute;top:0;left:0;right:0;height:26px;
  padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;
  background:repeating-linear-gradient(90deg, var(--lacquer) 0 34px, var(--lacquer-dark) 34px 40px);
  border-bottom:6px solid var(--gold)
}
.pond .roofline::after{
  content:"";position:absolute;left:0;right:0;bottom:-20px;height:14px;
  background:repeating-linear-gradient(90deg, transparent 0 14px, var(--gold) 14px 20px, transparent 20px 34px);opacity:.75
}
.pond .surface{
  position:absolute;left:0;right:0;bottom:0;height:18vh;
  background:linear-gradient(180deg, rgba(241,201,106,0) 0%, rgba(241,201,106,.08) 30%, rgba(31,107,101,.9) 100%);
}
.pond .surface::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg, transparent, rgba(241,201,106,.6), transparent)
}
.lobby{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;z-index:5
}
.lobby .card{
  background:rgba(7,25,26,.72);border:3px solid var(--gold);border-radius:24px;
  padding:26px 28px 24px;max-width:560px;width:100%;backdrop-filter:blur(6px)
}
.lobby .title{font-size:clamp(30px,5vw,54px)}
.lobby .qr{
  margin:18px auto 0;background:var(--paper);padding:14px;border-radius:16px;
  width:max-content;max-width:100%
}
.lobby .qr img,.lobby .qr canvas{display:block;max-width:100%}
.lobby .link{font-size:13px;color:var(--paper-dim);word-break:break-all;margin-top:10px}
.lobby .big{font-family:var(--display);font-size:clamp(20px,3vw,30px);font-weight:800;margin-top:16px;color:var(--gold-light)}
.lobby .big b{font-size:1.5em;color:var(--paper)}
.hostbar{
  position:absolute;left:0;right:0;bottom:0;z-index:6;
  display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg, transparent, rgba(7,25,26,.85));
  opacity:.25;transition:opacity .25s
}
.hostbar:hover,.hostbar:focus-within{opacity:1}
.flyer{
  position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;
  will-change:transform;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.5));
  transform:translate(var(--x), 120vh);
  transition:transform 3.2s cubic-bezier(.2,.75,.25,1);
}
.flyer.up{transform:translate(var(--x), var(--y))}
.flyer .inner{animation:floaty var(--dur) ease-in-out infinite;animation-delay:var(--dl)}
.flyer svg{width:var(--w);height:auto;display:block}
.flyer .tag{
  margin-top:-6px;background:var(--paper);color:var(--ink);font-weight:700;font-size:13px;
  padding:3px 10px;border-radius:999px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;
  border:2px solid var(--gold)
}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-18px) rotate(2deg)}
}
.bubble{
  position:absolute;bottom:-20px;border-radius:50%;
  border:1px solid rgba(241,201,106,.35);background:rgba(241,201,106,.06);
  animation:rise linear infinite
}
@keyframes rise{to{transform:translateY(-120vh) translateX(20px);opacity:0}}
.banner{
  position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:4;pointer-events:none;
  font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,56px);color:var(--gold-light);
  text-shadow:0 4px 0 var(--lacquer-dark), 0 10px 30px rgba(0,0,0,.6);
  opacity:0;transform:translateY(-10px);transition:opacity .8s 1.2s, transform .8s 1.2s
}
.banner.show{opacity:1;transform:none}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
  background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:12px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.4)
}
.note{font-size:13px;color:var(--paper-dim);margin-top:10px}
.mode-pill{
  position:fixed;top:8px;right:8px;z-index:70;font-size:11px;padding:4px 8px;border-radius:999px;
  background:rgba(224,164,49,.2);color:var(--gold-light);border:1px solid rgba(224,164,49,.5)
}
@media (prefers-reduced-motion: reduce){
  .stage-box .puppet,.wait .puppet,.flyer .inner,.bubble,.stage-box .ripple{animation:none}
  .flyer{transition-duration:.6s}
}
@media (max-width:420px){
  .title{font-size:28px}
  .tray{grid-auto-columns:86px}
}
</style>
</head>

function puppetSVG(p, extraClass){
  const kind = PUPPETS[p.puppet] ? p.puppet : 'teu';
  const items = p.items||{}, colors = p.colors||{};
  const layer = k => { const it = ITEMS[k][items[k]]; return it ? it.svg(colors[k]||it.def) : ''; };
  return `<svg class="${extraClass||''}" viewBox="30 0 140 320" xmlns="http://www.w3.org/2000/svg" aria-label="${PUPPETS[kind].name}">
    ${body(kind)}${layer('bottom')}${layer('top')}${head(kind)}${layer('hat')}${layer('acc')}
  </svg>`;
}
// Thumbnail 1 món trong khay
function itemThumb(slot, id, color){
  const it = ITEMS[slot][id];
  const vb = {hat:'30 0 140 110', top:'30 84 140 180', bottom:'30 186 140 110', acc:'30 40 140 200'}[slot];
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${it.svg(color||it.def)}</svg>`;
}

const useFirebase = !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.databaseURL);
let store;

const localStore = {
  ready: Promise.resolve(),
  read(k, d){ try{ return JSON.parse(localStorage.getItem('roinuoc.'+k)) ?? d }catch{ return d } },
  write(k, v){ try{ localStorage.setItem('roinuoc.'+k, JSON.stringify(v)) }catch{} ; this.ping(); },
  listeners:[],
  ping(){ this.listeners.forEach(f=>f()); try{ this.bc && this.bc.postMessage('x') }catch{} },
  init(){
    try{ this.bc = new BroadcastChannel('roinuoc'); this.bc.onmessage = ()=>this.listeners.forEach(f=>f()); }catch{}
    window.addEventListener('storage', ()=>this.listeners.forEach(f=>f()));
  },
  async savePuppet(id, p){ const all = this.read('puppets', {}); all[id]=p; this.write('puppets', all); },
  onPuppets(cb){ const f=()=>cb(this.read('puppets', {})); this.listeners.push(f); f(); },
  onStage(cb){ const f=()=>cb(this.read('stage', {revealed:false})); this.listeners.push(f); f(); },
  async setStage(s){ this.write('stage', s); },
  async clearAll(){ this.write('puppets', {}); this.write('stage', {revealed:false}); },
};

const fbStore = {
  ready:null, db:null,
  init(){
    this.ready = new Promise((res, rej)=>{
      const load = src => new Promise((r,e)=>{ const s=document.createElement('script'); s.src=src; s.onload=r; s.onerror=e; document.head.appendChild(s); });
      load('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js')
        .then(()=>load('https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js'))
        .then(()=>{ firebase.initializeApp(window.FIREBASE_CONFIG); this.db = firebase.database(); res(); })
        .catch(rej);
    });
  },
  async savePuppet(id, p){ await this.ready; await this.db.ref('puppets/'+id).set(p); },
  onPuppets(cb){ this.ready.then(()=>this.db.ref('puppets').on('value', s=>cb(s.val()||{}))); },
  onStage(cb){ this.ready.then(()=>this.db.ref('stage').on('value', s=>cb(s.val()||{revealed:false}))); },
  async setStage(s){ await this.ready; await this.db.ref('stage').set(s); },
  async clearAll(){ await this.ready; await this.db.ref('puppets').remove(); await this.db.ref('stage').set({revealed:false}); },
};

// ntfy.sh: mỗi tin là 1 JSON {k:'p'|'s'|'clear'}. Trạng thái được gộp lại ở phía đọc.
const useNtfy = !useFirebase && !!window.NTFY_TOPIC;
const ntfyStore = {
  liveForPlayers:false,           // điện thoại chỉ gửi, không lắng nghe (giới hạn theo IP của ntfy)
  base:'https://ntfy.sh/'+window.NTFY_TOPIC,
  state:{puppets:{}, stage:{revealed:false}, clearT:0},
  pl:[], sl:[], es:null, started:false,
  init(){
    try{ const c=JSON.parse(localStorage.getItem('roinuoc.ntfy.'+window.NTFY_TOPIC)); if(c) this.state=c; }catch{}
  },
  persist(){ try{ localStorage.setItem('roinuoc.ntfy.'+window.NTFY_TOPIC, JSON.stringify(this.state)) }catch{} },
  async post(obj){
    const r = await fetch(this.base, {method:'POST', body: JSON.stringify(obj)});
    if(!r.ok) throw new Error('ntfy '+r.status);
  },
  async savePuppet(id, p){ await this.post({k:'p', id, ...p}); },
  async setStage(s){ await this.post({k:'s', ...s, t:Date.now()}); },
  async clearAll(){ await this.post({k:'clear', t:Date.now()}); },
  apply(m){
    const st=this.state;
    if(m.k==='clear'){ st.clearT=Math.max(st.clearT, m.t||0);
      Object.keys(st.puppets).forEach(id=>{ if((st.puppets[id].t||0)<st.clearT) delete st.puppets[id]; });
      st.stage={revealed:false}; }
    else if(m.k==='p'){ if((m.t||0)>=st.clearT){ const cur=st.puppets[m.id]; if(!cur || (m.t||0)>=(cur.t||0)) st.puppets[m.id]={name:m.name,puppet:m.puppet,items:m.items||{},colors:m.colors||{},t:m.t||0}; } }
    else if(m.k==='s'){ if((m.t||0)>=(st.stage.t||0)) st.stage={revealed:!!m.revealed, t:m.t||0}; }
  },
  emit(){ this.persist(); this.pl.forEach(f=>f(this.state.puppets)); this.sl.forEach(f=>f(this.state.stage)); },
  handle(raw){ try{ const ev=JSON.parse(raw); if(ev.event==='message'){ this.apply(JSON.parse(ev.message)); return true; } }catch(e){ console.warn('bad msg', e); } return false; },
  async poll(){
    try{ const r=await fetch(this.base+'/json?poll=1&since=all'); const txt=await r.text();
      let any=false; txt.split('
').forEach(l=>{ if(l.trim()) any = this.handle(l) || any; }); this.emit(); }
    catch(e){ console.warn('poll fail', e); }
  },
  start(){
    if(this.started) return; this.started=true;
    this.emit();                                  // trạng thái đã lưu trên máy này
    this.poll();
    const open=()=>{
      if(this.es) this.es.close();
      this.es=new EventSource(this.base+'/sse?since=all');
      this.es.onmessage=e=>{ if(this.handle(e.data)) this.emit(); };
      this.es.onerror=()=>{};                     // EventSource tự nối lại
    };
    open();
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ this.poll(); open(); } });
  },
  onPuppets(cb){ this.pl.push(cb); this.start(); cb(this.state.puppets); },
  onStage(cb){ this.sl.push(cb); this.start(); cb(this.state.stage); },
};

store = useFirebase ? fbStore : (useNtfy ? ntfyStore : localStore);

// Kéo thả bằng Pointer Events (chạm + chuột). Chạm ngắn = mặc luôn.
function attachDrag(el){
  let ghost=null, sx=0, sy=0, moved=false, zone=null;
  el.addEventListener('pointerdown', e=>{
    if(e.button && e.button!==0) return;
    el.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY; moved=false; zone=document.getElementById('zone');
  });
  el.addEventListener('pointermove', e=>{
    if(!el.hasPointerCapture(e.pointerId)) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.hypot(dx,dy)>8){
      moved=true;
      if(el.dataset.id){
        ghost=document.createElement('div'); ghost.className='ghost';
        ghost.innerHTML=itemThumb(curSlot, el.dataset.id, me.colors[curSlot]);
        document.body.appendChild(ghost);
      }
    }
    if(ghost){
      ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      zone.classList.toggle('over', inZone(e, zone));
    }
  });
  const end = e=>{
    if(!el.hasPointerCapture(e.pointerId)) return;
    el.releasePointerCapture(e.pointerId);
    const z = document.getElementById('zone'); z && z.classList.remove('over');
    if(ghost){ ghost.remove(); ghost=null; }
    const id = el.dataset.id || null;
    if(!moved){ equip(curSlot, id); return; }           // chạm
    if(id && inZone(e, z)){ equip(curSlot, id); toast('Đã mặc '+ITEMS[curSlot][id].label); }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
function inZone(e, zone){
  if(!zone) return false;
  const r = zone.getBoundingClientRect();
  return e.clientX>=r.left && e.clientX<=r.right && e.clientY>=r.top && e.clientY<=r.bottom;
}

async function sendPuppet(){
  const btn = document.getElementById('send'); btn.disabled=true; btn.textContent='Đang gửi…';
  try{
    await store.savePuppet(me.id, {name:me.name, puppet:me.puppet, items:me.items, colors:me.colors, t:Date.now()});
    me.sent=true; saveMe(); renderWait();
  }catch(err){
    console.error(err); btn.disabled=false; btn.textContent='Gửi rối lên sân khấu';
    toast('Gửi không được. Kiểm tra mạng rồi thử lại.');
  }
}

/* ================= MÀN 3: CHỜ BAY ================= */
let waitUnsub = false;
function renderWait(){
  app.innerHTML = `
  <div class="wrap wait">
    <div class="roof"></div>
    <div class="eyebrow">Đã lên sân khấu</div>
    <h1 class="title">Rối của <em>${esc(me.name)}</em> đang đợi dưới nước</h1>
    <p class="lead" style="margin-inline:auto">${store.liveForPlayers===false
      ? 'Rối đã ở dưới ao trên màn hình lớn. Cuối chương trình, tất cả rối sẽ cùng bay lên. Nhìn lên sân khấu nhé!'
      : 'Giữ màn hình này. Khi người dẫn ra hiệu, tất cả rối sẽ cùng bay lên.'}</p>
    ${puppetSVG(me,'puppet')}
    <div><span class="count-pill" id="cnt" ${store.liveForPlayers===false?'hidden':''}>…</span></div>
    <div class="actions" style="justify-content:center">
      <button class="btn ghost small" id="edit">Sửa lại đồ</button>
    </div>
  </div>`;
  document.getElementById('edit').addEventListener('click', renderDress);
  if(!waitUnsub && store.liveForPlayers!==false){
    waitUnsub = true;
    store.onPuppets(all=>{ const c=document.getElementById('cnt'); if(c) c.textContent = Object.keys(all).length+' con rối đang chờ'; latestAll = all; });
    store.onStage(s=>{ if(s && s.revealed && !isStage){ renderPond(true); } else if(s && !s.revealed && document.querySelector('.pond') && !isStage){ renderWait(); } });
  }
}
let latestAll = {};

/* ================= SÂN KHẤU ================= */
let pondBuilt=false, revealed=false, flyers={};
function renderPond(viewerMode){
  if(document.querySelector('.pond')) return;
  app.innerHTML = `
  <div class="pond" id="pond">
    <div class="roofline"></div>
    <div class="banner" id="banner">Rối bay lên!</div>
    <div class="surface"></div>
    <div class="lobby" id="lobby" ${viewerMode?'hidden':''}>
      <div class="card">
        <div class="eyebrow">Thủy đình · Sân khấu</div>
        <h1 class="title">Quét mã, <em>mặc đồ</em> cho rối</h1>
        <div class="qr" id="qr"></div>
        <div class="link">${esc(baseURL)}</div>
        <div class="big"><b id="bigcnt">0</b> con rối đang chờ dưới nước</div>
      </div>
    </div>
    ${viewerMode?'':`
    <div class="hostbar" id="host">
      <button class="btn gold" id="fly">Cho rối bay lên!</button>
      <button class="btn ghost small" id="down">Hạ xuống</button>
      <button class="btn ghost small" id="wipe">Xóa tất cả</button>
    </div>`}
  </div>`;
  // Bong bóng nền
  const pond = document.getElementById('pond');
  for(let i=0;i<18;i++){
    const b=document.createElement('div'); b.className='bubble';
    const s=6+Math.random()*18; b.style.width=b.style.height=s+'px';
    b.style.left=Math.random()*100+'%'; b.style.animationDuration=(10+Math.random()*14)+'s';
    b.style.animationDelay=(-Math.random()*20)+'s'; pond.appendChild(b);
  }
  if(!viewerMode){
    try{ new QRCode(document.getElementById('qr'), {text: baseURL, width:200, height:200, colorDark:'#1C1A17', colorLight:'#F5EAD0'}); }
    catch(e){ document.getElementById('qr').textContent = baseURL; }
    document.getElementById('fly').addEventListener('click', ()=>store.setStage({revealed:true, at:Date.now()}));
    document.getElementById('down').addEventListener('click', ()=>store.setStage({revealed:false}));
    let armed=false;
    document.getElementById('wipe').addEventListener('click', e=>{
      if(!armed){ armed=true; e.target.textContent='Chắc chắn xóa? Bấm lần nữa'; setTimeout(()=>{armed=false; e.target.textContent='Xóa tất cả';}, 3000); return; }
      armed=false; e.target.textContent='Xóa tất cả'; store.clearAll(); toast('Đã xóa hết rối');
    });
  }
  if(!pondBuilt){
    pondBuilt=true;
    store.onPuppets(all=>{ latestAll=all; syncFlyers(all); const c=document.getElementById('bigcnt'); if(c) c.textContent=Object.keys(all).length; });
    store.onStage(s=>{ revealed = !!(s&&s.revealed); applyReveal(); });
  } else { syncFlyers(latestAll); applyReveal(); }
}
function layoutFor(i, n){
  // Rải đều theo lưới lệch hàng, kích cỡ theo số lượng
  const cols = Math.max(3, Math.ceil(Math.sqrt(n*1.6)));
  const rows = Math.max(1, Math.ceil(n/cols));
  const r = Math.floor(i/cols), c = i%cols;
  const jitter = (Math.sin(i*12.9898)*43758.5453)%1;
  const x = ((c+0.5)/cols)*100 + (r%2?3:-3) + jitter*4 - 2;
  const y = 14 + (r/(rows))*(60) + Math.abs(jitter)*6;
  const vw = window.innerWidth || 1200;
  const w = Math.max(64, Math.min(170, Math.floor((vw/cols)*0.62)));
  return {x, y, w};
}
function syncFlyers(all){
  const pond=document.getElementById('pond'); if(!pond) return;
  const ids = Object.keys(all).sort((a,b)=>(all[a].t||0)-(all[b].t||0));
  Object.keys(flyers).forEach(id=>{ if(!all[id]){ flyers[id].remove(); delete flyers[id]; } });
  ids.forEach((id,i)=>{
    const p=all[id]; const {x,y,w}=layoutFor(i, ids.length);
    let el=flyers[id];
    const sig = JSON.stringify([p.puppet,p.items,p.colors,p.name]);
    if(!el){
      el=document.createElement('div'); el.className='flyer'; pond.appendChild(el); flyers[id]=el;
      el.style.setProperty('--dur', (3.5+Math.random()*2.5)+'s');
      el.style.setProperty('--dl', (-Math.random()*4)+'s');
    }
    if(el.dataset.sig!==sig){
      el.dataset.sig=sig;
      el.innerHTML=`<div class="inner">${puppetSVG(p)}<div class="tag">${esc(p.name||'Ẩn danh')}</div></div>`;
    }
    el.style.setProperty('--x', `calc(${x}vw - ${w/2}px)`);
    el.style.setProperty('--y', y+'vh');
    el.style.setProperty('--w', w+'px');
    if(revealed && !el.classList.contains('up')){
      const delay = el.dataset.shown ? 0 : i*140;
      setTimeout(()=>el.classList.add('up'), delay);
      el.dataset.shown='1';
    }
  });
}
function applyReveal(){
  const lobby=document.getElementById('lobby'), banner=document.getElementById('banner');
  const fly=document.getElementById('fly');
  if(revealed){
    if(lobby) lobby.hidden=true;
    banner && banner.classList.add('show');
    fly && (fly.textContent='Đang bay…');
    syncFlyers(latestAll);
  } else {
    if(lobby && isStage) lobby.hidden=false;
    banner && banner.classList.remove('show');
    fly && (fly.textContent='Cho rối bay lên!');
    Object.values(flyers).forEach(el=>{ el.classList.remove('up'); delete el.dataset.shown; });
  }
}

/* ================= KHỞI ĐỘNG ================= */
if(isStage){
  document.body.style.overflow='hidden';
  renderPond(false);
} else if(me.sent && me.puppet){
  renderWait();
} else {
  renderPick();
}
window.addEventListener('hashchange', ()=>location.reload());
})();
</script>
